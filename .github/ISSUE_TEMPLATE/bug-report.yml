name: Bug report
description: Report something that is not working as expected.
labels:
  - bug

body:
  - type: textarea
    id: current-behavior
    attributes:
      label: Current behavior
      description: Describe what is currently happening.
      placeholder: Describe the problem as clearly as possible.
    validations:
      required: true

  - type: textarea
    id: expected-behavior
    attributes:
      label: Expected behavior
      description: Describe what should happen instead.
    validations:
      required: true

  - type: textarea
    id: steps-to-reproduce
    attributes:
      label: Steps to reproduce
      description: Provide the steps needed to reproduce the problem.
      placeholder: |
        1. Go to ...
        2. Click on ...
        3. ...
        4. See the error
    validations:
      required: true

  - type: dropdown
    id: environment
    attributes:
      label: Environment
      description: Select the environment where the problem occurs.
      options:
        - Local
        - Staging
        - Production
    validations:
      required: true

  - type: textarea
    id: additional-context
    attributes:
      label: Additional context
      description: Add screenshots, logs, links, or any other relevant information.
    validations:
      required: false
